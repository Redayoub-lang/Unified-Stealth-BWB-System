<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stealth BWB Advanced Threat & C2 Center</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050b14; font-family: 'Courier New', monospace; color: #00ffcc; }
        #hud { position: absolute; top: 15px; left: 15px; background: rgba(5, 15, 25, 0.92); border: 1px solid #00ffcc; padding: 15px; border-radius: 6px; width: 310px; z-index: 10; box-shadow: 0 0 15px rgba(0, 255, 204, 0.15); }
        .hud-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; }
        .val { font-weight: bold; color: #ffffff; }
        .alert-safe { color: #00ffcc; font-weight: bold; }
        .alert-warn { color: #ffaa00; font-weight: bold; }
        .alert-danger { color: #ff0055; font-weight: bold; animation: blink 0.8s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .btn-group { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        button { background: #003344; color: #00ffcc; border: 1px solid #00ffcc; padding: 6px 6px; cursor: pointer; font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; border-radius: 3px; transition: 0.15s; }
        button:hover { background: #00ffcc; color: #000; }
        button.btn-warn { border-color: #ffaa00; color: #ffaa00; background: #332200; }
        button.btn-warn:hover { background: #ffaa00; color: #000; }
        button.btn-danger { border-color: #ff0055; color: #ff0055; background: #330011; }
        button.btn-danger:hover { background: #ff0055; color: #fff; }
        .hint { margin-top: 10px; font-size: 11px; color: #6699aa; text-align: center; border-top: 1px solid #003344; padding-top: 6px; }
        #video-container { position: absolute; bottom: 15px; right: 15px; width: 320px; height: 180px; border: 1px solid #00ffcc; background: #000; border-radius: 4px; overflow: hidden; z-index: 10; box-shadow: 0 0 15px rgba(0, 255, 204, 0.15); }
        #cam-feed { width: 100%; height: 100%; object-fit: contain; display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <h3 style="margin:0 0 10px 0; font-size:14px; text-align:center; letter-spacing: 1px;">⚡ STEALTH BWB TACTICAL C2</h3>
        <div class="hud-row"><span>STATUS:</span><span id="st" class="alert-warn">CONNECTING...</span></div>
        <div class="hud-row"><span>FLIGHT MODE:</span><span id="mode" class="val">--</span></div>
        <div class="hud-row"><span>AIRSPEED:</span><span id="spd" class="val">0.0 m/s</span></div>
        <div class="hud-row"><span>ALTITUDE:</span><span id="alt" class="val">0.0 m</span></div>
        <div class="hud-row"><span>DYNAMIC RCS:</span><span id="rcs" class="val">-26.0 dBsm</span></div>
        <div class="hud-row"><span>RADAR DETECTION:</span><span id="threat-status" class="alert-safe">STEALTH CLEAR</span></div>
        <div class="hud-row"><span>SAM DISTANCE:</span><span id="sam-dist" class="val">0.0 m</span></div>
        <div class="hud-row"><span>BATTERY:</span><span id="bat" class="val">100.0%</span></div>

        <div class="btn-group">
            <button onclick="setMode('TAKEOFF')">TAKEOFF</button>
            <button onclick="setMode('CRUISE')">CRUISE</button>
            <button onclick="setMode('NAV_AUTO')">AUTO NAV</button>
            <button id="stealth-btn" onclick="toggleStealth()">STEALTH: ON</button>
            <button class="btn-warn" onclick="setMode('RTL')">RTL HOME</button>
            <button onclick="clearWaypoints()">CLEAR WPs</button>
            <button class="btn-danger" style="grid-column: span 3;" onclick="resetSimulation()">RESET MISSION</button>
        </div>
        <div class="hint">Click anywhere on the 3D grid to add a Waypoint</div>
    </div>

    <div id="video-container">
        <img id="cam-feed" src="" alt="Optical Feed">
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Ground & Grid
        const grid = new THREE.GridHelper(2000, 50, 0x00ffcc, 0x002233);
        scene.add(grid);

        const planeGeo = new THREE.PlaneGeometry(2000, 2000);
        planeGeo.rotateX(-Math.PI / 2);
        const groundPlane = new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ visible: false }));
        scene.add(groundPlane);

        scene.add(new THREE.AmbientLight(0x404040, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(200, 500, 300);
        scene.add(dirLight);

        // SAM Radar Threat Zone (Red Mesh Dome)
        const radarDomeGeo = new THREE.SphereGeometry(180, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
        const radarDomeMat = new THREE.MeshBasicMaterial({ color: 0xff0044, wireframe: true, transparent: true, opacity: 0.25 });
        const radarDome = new THREE.Mesh(radarDomeGeo, radarDomeMat);
        radarDome.position.set(300, 0, 400);
        scene.add(radarDome);
        // حزام الأمان لمناورة الالتفاف الذكي (275m Evasion Buffer)
        const bufferRingGeo = new THREE.RingGeometry(273, 276, 64);
        bufferRingGeo.rotateX(-Math.PI / 2);
        const bufferRing = new THREE.Mesh(
            bufferRingGeo,
            new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide, transparent: true, opacity: 0.45 })
        );
        bufferRing.position.set(300, 0.5, 400);
        scene.add(bufferRing);

        // BWB Flying-Wing 3D Mesh (Nose along +Z in local space)
        const droneGroup = new THREE.Group();
        droneGroup.rotation.order = 'YXZ'; // مطابقة ترتيب الدوران الفيزيائي: Yaw -> Pitch -> Roll

        const wingShape = new THREE.Shape();
        wingShape.moveTo(0, 14);
        wingShape.lineTo(18, -8);
        wingShape.lineTo(6, -12);
        wingShape.lineTo(0, -7);
        wingShape.lineTo(-6, -12);
        wingShape.lineTo(-18, -8);
        wingShape.closePath();

        const bwbGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 1.5, bevelEnabled: false });
        bwbGeo.rotateX(Math.PI / 2);
        const bwbMesh = new THREE.Mesh(bwbGeo, new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true }));
        droneGroup.add(bwbMesh);
        scene.add(droneGroup);

        // Waypoints Marker Group
        const wpMarkersGroup = new THREE.Group();
        scene.add(wpMarkersGroup);

        // Sliding Flight Trajectory Line (Trail)
        const maxTrailPoints = 600;
        const trailPositions = new Float32Array(maxTrailPoints * 3);
        const trailGeometry = new THREE.BufferGeometry();
        trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        const trailMaterial = new THREE.LineBasicMaterial({ color: 0x00ffcc });
        const trailLine = new THREE.Line(trailGeometry, trailMaterial);
        scene.add(trailLine);
        let trailCount = 0;

        camera.position.set(0, 260, 420);
        camera.lookAt(0, 0, 0);

        // Waypoint Raycasting (Protected against HUD & Video clicks)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.closest('#hud') || event.target.closest('#video-container')) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(groundPlane);

            if (intersects.length > 0) {
                const pt = intersects[0].point;
                sendCommand({ "add_wp": [Number(pt.x.toFixed(1)), Number(pt.z.toFixed(1)), -120.0] });
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // WebSocket Connection with Auto-Reconnect
        let ws = null;
        let stealthEnabled = true;

        function sendCommand(payload) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(payload));
            }
        }

        function connectWebSocket() {
            ws = new WebSocket(`ws://${location.host}/ws/telemetry`);

            ws.onopen = () => {
                const st = document.getElementById('st');
                st.innerText = "LIVE ONLINE";
                st.className = "alert-safe";
            };

            ws.onclose = () => {
                const st = document.getElementById('st');
                st.innerText = "RECONNECTING...";
                st.className = "alert-danger";
                setTimeout(connectWebSocket, 1500);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const telem = data.telemetry || {};
                const threat = telem.radar_threat || {};

                document.getElementById('mode').innerText = data.mode || "--";
                document.getElementById('spd').innerText = Number(telem.airspeed || 0).toFixed(1) + " m/s";
                document.getElementById('alt').innerText = Number(telem.altitude || 0).toFixed(1) + " m";
                document.getElementById('rcs').innerText = Number(telem.rcs_dBsm || -26.0).toFixed(1) + " dBsm";
                document.getElementById('sam-dist').innerText = Number(threat.distance_to_radar || 0).toFixed(1) + " m";

                const batVal = Number(telem.battery_pct ?? 100.0);
                const batElem = document.getElementById('bat');
                batElem.innerText = batVal.toFixed(1) + "%";
                batElem.className = batVal < 25.0 ? "alert-danger" : (batVal < 50.0 ? "alert-warn" : "val");

                const threatElem = document.getElementById('threat-status');
                if (threat.is_detected) {
                    threatElem.innerText = "WARNING: DETECTED!";
                    threatElem.className = "alert-danger";
                } else if (data.evasion_active) {
                    threatElem.innerText = "EVADING SAM RADAR";
                    threatElem.className = "alert-warn";
                } else {
                    threatElem.innerText = "STEALTH CLEAR";
                    threatElem.className = "alert-safe";
                }
                const threatElem = document.getElementById('threat-status');
                if (threat.is_detected) {
                    threatElem.innerText = "WARNING: DETECTED!";
                    threatElem.className = "alert-danger";
                } else {
                    threatElem.innerText = "STEALTH CLEAR";
                    threatElem.className = "alert-safe";
                }

                if (data.waypoints) updateWaypointMarkers(data.waypoints, data.target_wp);

                if (telem.position && telem.euler) {
                    const posX = telem.position[0];
                    const posY = -telem.position[2];
                    const posZ = telem.position[1];

                    droneGroup.position.set(posX, posY, posZ);
                    droneGroup.rotation.set(
                        THREE.MathUtils.degToRad(-telem.euler[1]),               // Pitch
                        THREE.MathUtils.degToRad(-telem.euler[2]) + Math.PI / 2,  // Yaw
                        THREE.MathUtils.degToRad(-telem.euler[0])                // Roll
                    );

                    // Update Sliding Trajectory Trail
                    const positions = trailLine.geometry.attributes.position.array;
                    if (trailCount < maxTrailPoints) {
                        positions[trailCount * 3] = posX;
                        positions[trailCount * 3 + 1] = posY;
                        positions[trailCount * 3 + 2] = posZ;
                        trailCount++;
                    } else {
                        positions.copyWithin(0, 3);
                        const lastIdx = (maxTrailPoints - 1) * 3;
                        positions[lastIdx] = posX;
                        positions[lastIdx + 1] = posY;
                        positions[lastIdx + 2] = posZ;
                    }
                    trailLine.geometry.setDrawRange(0, trailCount);
                    trailLine.geometry.attributes.position.needsUpdate = true;
                }

                if (data.frame) {
                    document.getElementById('cam-feed').src = "data:image/jpeg;base64," + data.frame;
                }
            };
        }

        function updateWaypointMarkers(wps, targetWp) {
            while (wpMarkersGroup.children.length > 0) {
                wpMarkersGroup.remove(wpMarkersGroup.children[0]);
            }

            const renderList = [...wps];
            if (targetWp && !renderList.some(wp => Math.abs(wp[0] - targetWp[0]) < 0.5 && Math.abs(wp[1] - targetWp[1]) < 0.5)) {
                renderList.push(targetWp);
            }

            renderList.forEach((wp) => {
                const isTarget = targetWp &&
                    Math.abs(wp[0] - targetWp[0]) < 0.5 &&
                    Math.abs(wp[1] - targetWp[1]) < 0.5;

                const marker = new THREE.Mesh(
                    new THREE.SphereGeometry(isTarget ? 8 : 5.5, 16, 16),
                    new THREE.MeshBasicMaterial({ color: isTarget ? 0xff0055 : 0x00ffcc })
                );
                marker.position.set(wp[0], -wp[2], wp[1]);
                wpMarkersGroup.add(marker);
            });
        }

        function setMode(mode) { sendCommand({ "command": mode }); }
        function clearWaypoints() { sendCommand({ "clear_wps": true }); }

        function toggleStealth() {
            stealthEnabled = !stealthEnabled;
            document.getElementById('stealth-btn').innerText = stealthEnabled ? "STEALTH: ON" : "STEALTH: OFF";
            sendCommand({ "stealth_mode": stealthEnabled });
        }

        function resetSimulation() {
            trailCount = 0;
            trailLine.geometry.setDrawRange(0, 0);
            sendCommand({ "command": "RESET" });
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        connectWebSocket();
        animate();
    </script>
</body>
</html>
