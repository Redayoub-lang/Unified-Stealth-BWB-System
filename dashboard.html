<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stealth BWB Advanced Threat & Tactical C2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #03070c;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #hud-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 340px;
            background: rgba(4, 14, 24, 0.88);
            border: 1px solid #00ffcc;
            border-radius: 8px;
            padding: 16px;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
        }
        .hud-title {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 14px;
            color: #00ffcc;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 7px;
            font-weight: bold;
        }
        .stat-label { color: #00e6b8; }
        .alert-safe { color: #00ff88; }
        .alert-warn { color: #ffaa00; }
        .alert-danger { color: #ff3355; }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 14px;
        }
        button {
            background: rgba(0, 45, 55, 0.85);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            border-radius: 4px;
            padding: 8px 4px;
            font-family: inherit;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }
        button:hover { background: #00ffcc; color: #03070c; }
        .btn-rtl {
            background: rgba(80, 45, 0, 0.85);
            border-color: #ffaa00;
            color: #ffaa00;
        }
        .btn-rtl:hover { background: #ffaa00; color: #03070c; }
        .btn-reset {
            grid-column: span 3;
            background: rgba(85, 10, 25, 0.85);
            border-color: #ff3355;
            color: #ff6680;
            margin-top: 2px;
        }
        .btn-reset:hover { background: #ff3355; color: #ffffff; }

        .hint-text {
            text-align: center;
            font-size: 11px;
            color: #7f9eb2;
            margin-top: 12px;
            line-height: 1.4;
        }

        #video-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 340px;
            height: 200px;
            background: #02060a;
            border: 1px solid #00ffcc;
            border-radius: 6px;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.15);
        }
        #video-feed {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="hud-panel">
        <div class="hud-title">⚡ STEALTH BWB TACTICAL C2</div>
        <div class="stat-row"><span class="stat-label">STATUS:</span><span id="conn-status" class="alert-warn">CONNECTING...</span></div>
        <div class="stat-row"><span class="stat-label">FLIGHT MODE:</span><span id="flight-mode">--</span></div>
        <div class="stat-row"><span class="stat-label">AIRSPEED:</span><span id="airspeed">0.0 m/s</span></div>
        <div class="stat-row"><span class="stat-label">ALTITUDE:</span><span id="altitude">0.0 m</span></div>
        <div class="stat-row"><span class="stat-label">DYNAMIC RCS:</span><span id="rcs-val">-26.0 dBsm</span></div>
        <div class="stat-row"><span class="stat-label">RADAR DETECTION:</span><span id="threat-status" class="alert-safe">STEALTH CLEAR</span></div>
        <div class="stat-row"><span class="stat-label">SAM DISTANCE:</span><span id="sam-dist">0.0 m</span></div>
        <div class="stat-row"><span class="stat-label">BATTERY:</span><span id="battery">100.0%</span></div>

        <div class="btn-grid">
            <button onclick="sendCommand('TAKEOFF')">TAKEOFF</button>
            <button onclick="sendCommand('CRUISE')">CRUISE</button>
            <button onclick="sendCommand('NAV_AUTO')">AUTO NAV</button>
            <button id="btn-stealth" onclick="toggleStealth()">STEALTH: ON</button>
            <button class="btn-rtl" onclick="sendCommand('RTL')">RTL HOME</button>
            <button onclick="clearWaypoints()">CLEAR WPs</button>
            <button class="btn-reset" onclick="sendCommand('RESET')">RESET MISSION</button>
        </div>

        <div class="hint-text">Click anywhere on the 3D grid to add a Waypoint</div>
    </div>

    <div id="video-container">
        <img id="video-feed" alt="Optical Feed" />
    </div>

    <script>
        // 1. Initialisation de la scène 3D Three.js
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03070c, 0.00045);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 5000);
        camera.position.set(-280, 260, -240);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(150, 40, 220);

        // Lumières
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0x00ffcc, 0.9);
        dirLight.position.set(200, 400, 200);
        scene.add(dirLight);

        // Grille tactique au sol (2400m x 2400m)
        const gridHelper = new THREE.GridHelper(2400, 48, 0x00ffcc, 0x0b2538);
        scene.add(gridHelper);

        // Plan invisible pour détecter les clics souris sur la grille
        const groundPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(2400, 2400).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        scene.add(groundPlane);

        // 2. Site Radar SAM (300, 0, 400) + Zone de détection (180m) + Anneau d'évitement (275m)
        const samPos = new THREE.Vector3(300, 0, 400);

        const samTower = new THREE.Mesh(
            new THREE.CylinderGeometry(4, 8, 22, 12),
            new THREE.MeshBasicMaterial({ color: 0xff3355 })
        );
        samTower.position.set(samPos.x, 11, samPos.z);
        scene.add(samTower);

        const radarDome = new THREE.Mesh(
            new THREE.SphereGeometry(180, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2),
            new THREE.MeshBasicMaterial({ color: 0xff2244, wireframe: true, transparent: true, opacity: 0.28 })
        );
        radarDome.position.copy(samPos);
        scene.add(radarDome);

        const bufferRingGeo = new THREE.RingGeometry(272, 276, 64);
        bufferRingGeo.rotateX(-Math.PI / 2);
        const bufferRing = new THREE.Mesh(
            bufferRingGeo,
            new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
        );
        bufferRing.position.set(samPos.x, 0.6, samPos.z);
        scene.add(bufferRing);

        // 3. Modèle 3D de l'aile volante BWB
        const bwbShape = new THREE.Shape();
        bwbShape.moveTo(14, 0);
        bwbShape.lineTo(-8, 24);
        bwbShape.lineTo(-14, 22);
        bwbShape.lineTo(-10, 5);
        bwbShape.lineTo(-13, 0);
        bwbShape.lineTo(-10, -5);
        bwbShape.lineTo(-14, -22);
        bwbShape.lineTo(-8, -24);
        bwbShape.closePath();

        const bwbGeo = new THREE.ExtrudeGeometry(bwbShape, { depth: 1.8, bevelEnabled: false });
        bwbGeo.rotateX(Math.PI / 2);
        const uavMesh = new THREE.Mesh(
            bwbGeo,
            new THREE.MeshPhongMaterial({ color: 0x00ffcc, emissive: 0x004433, side: THREE.DoubleSide })
        );
        scene.add(uavMesh);

        // Traînée de trajectoire (Trail) et marqueurs de waypoints
        const trailPoints = [];
        const trailGeo = new THREE.BufferGeometry();
        const trailLine = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({ color: 0x00ff88 }));
        scene.add(trailLine);

        const wpGroup = new THREE.Group();
        scene.add(wpGroup);
        let lastWpSignature = "";

        function updateWaypointsVisual(waypoints) {
            const sig = JSON.stringify(waypoints || []);
            if (sig === lastWpSignature) return;
            lastWpSignature = sig;

            while (wpGroup.children.length > 0) {
                wpGroup.remove(wpGroup.children[0]);
            }
            if (!waypoints || waypoints.length === 0) return;

            const linePts = [];
            waypoints.forEach((wp) => {
                const wx = wp[0];
                const wy = Math.abs(wp[2]);
                const wz = wp[1];
                linePts.push(new THREE.Vector3(wx, wy, wz));

                const sphere = new THREE.Mesh(
                    new THREE.SphereGeometry(5, 12, 12),
                    new THREE.MeshBasicMaterial({ color: 0x00e5ff })
                );
                sphere.position.set(wx, wy, wz);
                wpGroup.add(sphere);

                const stemGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(wx, 0, wz),
                    new THREE.Vector3(wx, wy, wz)
                ]);
                wpGroup.add(new THREE.Line(stemGeo, new THREE.LineBasicMaterial({ color: 0x007799 })));
            });

            if (linePts.length > 1) {
                linePts.push(linePts[0].clone());
                const pathGeo = new THREE.BufferGeometry().setFromPoints(linePts);
                wpGroup.add(new THREE.Line(pathGeo, new THREE.LineBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.5 })));
            }
        }

        // 4. Interaction clic souris sur la grille pour ajouter un Waypoint
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let downPos = { x: 0, y: 0 };

        renderer.domElement.addEventListener('pointerdown', (e) => {
            downPos = { x: e.clientX, y: e.clientY };
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
            if (moved > 5) return; // Ignorer si c'était une rotation caméra

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const hits = raycaster.intersectObject(groundPlane);
            if (hits.length > 0 && ws && ws.readyState === WebSocket.OPEN) {
                const pt = hits[0].point;
                ws.send(JSON.stringify({ add_wp: [Number(pt.x.toFixed(1)), Number(pt.z.toFixed(1)), -120.0] }));
            }
        });

        // 5. Connexion WebSocket avec reconnexion automatique
        let ws = null;
        let stealthEnabled = true;

        function connectWebSocket() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${window.location.host}/ws/telemetry`);

            ws.onopen = () => {
                const statusEl = document.getElementById('conn-status');
                statusEl.innerText = "LIVE ONLINE";
                statusEl.className = "alert-safe";
            };

            ws.onclose = () => {
                const statusEl = document.getElementById('conn-status');
                statusEl.innerText = "RECONNECTING...";
                statusEl.className = "alert-warn";
                setTimeout(connectWebSocket, 1500);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const tel = data.telemetry;
                if (!tel) return;

                const modeText = data.failsafe_reason ? `${data.mode} (${data.failsafe_reason})` : data.mode;
                document.getElementById('flight-mode').innerText = modeText || "--";
                document.getElementById('airspeed').innerText = `${Number(tel.airspeed || 0).toFixed(1)} m/s`;
                document.getElementById('altitude').innerText = `${Number(tel.altitude || 0).toFixed(1)} m`;
                document.getElementById('rcs-val').innerText = `${Number(tel.rcs_dBsm || -26).toFixed(1)} dBsm`;
                document.getElementById('battery').innerText = `${Number(tel.battery_pct || 0).toFixed(1)}%`;

                const threat = tel.radar_threat || {};
                document.getElementById('sam-dist').innerText = `${Number(threat.distance_to_radar || 0).toFixed(1)} m`;

                const threatElem = document.getElementById('threat-status');
                if (threat.is_detected) {
                    threatElem.innerText = "WARNING: DETECTED!";
                    threatElem.className = "alert-danger";
                } else if (data.evasion_active) {
                    threatElem.innerText = "EVADING SAM RADAR";
                    threatElem.className = "alert-warn";
                } else {
                    threatElem.innerText = "STEALTH CLEAR";
                    threatElem.className = "alert-safe";
                }

                if (data.frame) {
                    document.getElementById('video-feed').src = `data:image/jpeg;base64,${data.frame}`;
                }

                // Mise à jour position et orientation 3D (NED -> Three.js)
                const pos = tel.position || tel.pos || [0, 0, -60];
                const euler = tel.euler || tel.euler_deg || [0, 0, 0];

                uavMesh.position.set(pos[0], -pos[2], pos[1]);
                uavMesh.rotation.order = 'YXZ';
                uavMesh.rotation.y = -THREE.MathUtils.degToRad(euler[2]);
                uavMesh.rotation.z = THREE.MathUtils.degToRad(euler[1]);
                uavMesh.rotation.x = THREE.MathUtils.degToRad(euler[0]);

                trailPoints.push(uavMesh.position.clone());
                if (trailPoints.length > 220) trailPoints.shift();
                trailGeo.setFromPoints(trailPoints);

                updateWaypointsVisual(data.waypoints);
            };
        }

        function sendCommand(cmd) {
            if (cmd === 'RESET') {
                trailPoints.length = 0;
                trailGeo.setFromPoints(trailPoints);
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: cmd }));
            }
        }

        function toggleStealth() {
            stealthEnabled = !stealthEnabled;
            const btn = document.getElementById('btn-stealth');
            btn.innerText = stealthEnabled ? "STEALTH: ON" : "STEALTH: OFF";
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ stealth_mode: stealthEnabled }));
            }
        }

        function clearWaypoints() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ clear_wps: true }));
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        connectWebSocket();
        animate();
    </script>
</body>
</html>
